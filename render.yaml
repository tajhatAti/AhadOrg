# render.yaml — Render Auto-Deploy Configuration
# ==============================================
# 🚀 SINGLE-SERVICE DEPLOY (default): ONE web service runs everything —
#    the site, the in-process job runner, and the public /live/{slug}/
#    gateway. It needs the Docker image (language toolchains for user jobs),
#    so `runtime: docker` + the repo-root Dockerfile are mandatory.
#
#    Embedded mode activates automatically: as long as RUNNER_SERVICE_URL is
#    NOT set, jobs spawn inside this process. (Want the old two-service
#    layout instead? Deploy runner/ as its own service and set
#    RUNNER_SERVICE_URL + RUNNER_SERVICE_SECRET here — the app switches.)
#
# 📌 PERMANENT DATA with Supabase (PostgreSQL free tier):
#    Supabase Dashboard → Project Settings → Database → Connection string
#    (Session pooler, port 5432) → paste as DATABASE_URL below in the Render
#    dashboard. With DATABASE_URL set, data is permanent — no disk needed.

services:
  - type: web
    name: ahad-co-auth
    runtime: docker                    # root Dockerfile = web + embedded runner
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeploy: true                   # deploys on every push to main

    envVars:
      - key: DATABASE_URL              # ⚠️ REQUIRED for permanent data (Supabase)
        sync: false

      - key: SITE_BASE_URL             # this service's own public URL — used to
        sync: false                    # build job URLs: {SITE_BASE_URL}/live/{slug}/
                                       # e.g. https://ahad-co-auth.onrender.com

      - key: ADMIN_EMAILS              # comma-separated owner emails → is_admin
        sync: false                    # granted automatically at login

      - key: BREVO_API_KEY             # OTP email delivery
        sync: false

      - key: SENDER_EMAIL
        sync: false

      - key: SENDER_NAME
        value: Ahad Co

      - key: OTP_EXPIRY_MINUTES
        value: "10"

      - key: PG_SSLMODE
        value: prefer

      # ── intentionally UNSET: RUNNER_SERVICE_URL / RUNNER_SERVICE_SECRET ──
      # (leaving them unset is what turns the embedded runner ON)

    # Health check
    healthCheckPath: /health

# Two-service layout (optional, not needed by default):
#   deploy runner/ with runner/Dockerfile as a second web service,
#   then set RUNNER_SERVICE_URL + RUNNER_SERVICE_SECRET on this one.
